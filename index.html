<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fintech Admin Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <button class="mobile-menu-btn" type="button" aria-label="Open navigation menu">☰</button>
      <div class="sidebar-overlay" hidden></div>
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="sidebar-top">
          <div class="workspace-switcher">
            <label for="workspaceSelect">Workspace</label>
            <select id="workspaceSelect" aria-label="Workspace switcher">
              <option>Northwind Capital</option>
              <option>Vertex Pay</option>
            </select>
          </div>
          <div class="role-switcher">
            <label for="roleSelect">Role</label>
            <select id="roleSelect" aria-label="Role switcher">
              <option value="admin">Admin</option>
              <option value="analyst">Analyst</option>
              <option value="support">Support</option>
            </select>
          </div>
          <button class="collapse-btn" type="button" aria-label="Collapse sidebar">⇤</button>
        </div>

        <nav aria-label="Application navigation">
          <div class="sidebar-scroll" tabindex="-1"></div>
        </nav>

        <div class="sidebar-bottom">
          <div class="user-profile" aria-label="Signed in user">
            <span class="avatar" aria-hidden="true">JD</span>
            <div class="user-meta">
              <strong>Jordan Doe</strong>
              <small>Operations Lead</small>
            </div>
          </div>
          <div class="bottom-actions">
            <a href="#/settings/profile">Settings</a>
            <a href="#/logout">Logout</a>
          </div>
        </div>
      </aside>

      <main class="content" tabindex="-1">
        <h1>Fintech Admin Dashboard</h1>
        <p>Use the navigation to simulate route changes and RBAC filtering.</p>
      </main>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
